<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Chapter 15 - Arrays</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    #output {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .result-card strong {
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <main class="container">
    <span class="badge">A Smarter Way to Learn JavaScript</span>
    <h1>Chapter 15: Arrays</h1>
    <p class="subtitle">Array indexing, element updates, and mixed values output</p>
    <div id="output"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
