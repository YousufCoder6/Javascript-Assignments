<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Chapter 20 - Nested for Loops</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 740px;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      background: rgba(244, 114, 182, 0.15);
      color: #f9a8d4;
      border: 1px solid rgba(244, 114, 182, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .summary-bar {
      background: #0f172a;
      border-left: 4px solid #f472b6;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.94rem;
      color: #fbcfe8;
    }

    .names-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .name-card {
      background: #0f172a;
      border: 1px solid rgba(244, 114, 182, 0.22);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      color: #f8fafc;
    }

    .name-card span {
      color: #94a3b8;
      font-size: 0.8rem;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <main class="container">
    
    <h1>Chapter 20: for Loops Nested</h1>
    <p class="subtitle">
      Generating combined names from firstNames and lastNames using outer and inner loops
    </p>
    <div id="summary" class="summary-bar"></div>
    <div id="output" class="names-grid"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
